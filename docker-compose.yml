services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: magnus_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magnus}
      POSTGRES_USER: ${POSTGRES_USER:-magnus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnus_change_me}
    volumes:
      - magnus_pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=4MB -c maintenance_work_mem=64MB -c max_connections=50 -c synchronous_commit=on -c checkpoint_completion_target=0.9 -c log_min_duration_statement=1000
    networks:
      - magnus_net
    restart: always
    mem_limit: 1024m
    pids_limit: 200
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magnus} -d ${POSTGRES_DB:-magnus}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # Magnus-OS2 (All-in-One: Node 20)
  # ========================================
  magnus:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: magnus_os2_app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://magnus_app:c19428c5c9e84e684c475228eed5c8e69d285b2caf7ff39d@postgres:5432/magnus}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - magnus_net
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/server/data
      - /home/osvaldo/backups/magnus-os2:/app/server/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2048m
    pids_limit: 300
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # AI Local (Ollama) - Desactivado a peticion
  # ========================================
  ollama:
    profiles: ["disabled"]
    image: ollama/ollama
    container_name: magnus_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - magnus_net
    restart: unless-stopped

  # ========================================
  # AI Sandbox (Python Execution)
  # ========================================
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: magnus_sandbox
    volumes:
      - ./server/data/sandbox:/sandbox
    networks:
      - magnus_net
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - magnus

# ========================================
# Networks
# ========================================
networks:
  magnus_net:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  magnus_pgdata:
    driver: local
  ollama_data:
    driver: local
